<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝花夕拾 · 梦蝶诗集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    color: rgba(255,255,255,0.92);
    background: #08080d;
  }
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    opacity: 0; transition: opacity 1.6s ease;
  }
  .bg-layer.visible { opacity: 1; }
  #particles {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
  }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
  }
  header {
    position: fixed; top: 28px; left: 36px; z-index: 10;
    font-size: 14px; letter-spacing: 6px; opacity: 0.55; font-weight: 300;
    cursor: pointer; transition: opacity 0.6s;
  }
  header:hover { opacity: 0.9; }
  .counter {
    position: fixed; top: 28px; right: 36px; z-index: 10;
    font-size: 13px; letter-spacing: 3px; opacity: 0.45; font-weight: 300;
    font-variant-numeric: tabular-nums;
  }
  main {
    position: relative; z-index: 5;
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  .poem {
    max-height: 78vh; overflow-y: auto; padding: 4vh 6vw;
    text-align: center; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 6%, black 94%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 6%, black 94%, transparent);
  }
  .poem::-webkit-scrollbar { display: none; }
  .poem h2 {
    font-size: clamp(26px, 4vw, 38px); font-weight: 500;
    letter-spacing: 14px; margin-bottom: 1.2vh; text-indent: 14px;
    opacity: 0; animation: rise 1.4s ease forwards;
  }
  .poem .date {
    font-size: 12px; letter-spacing: 3px; font-weight: 300;
    color: rgba(255,255,255,0.38); margin-bottom: 4.5vh;
    opacity: 0; animation: rise 1.4s ease 0.2s forwards;
  }
  .poem .line {
    font-size: clamp(16px, 2.1vw, 21px); font-weight: 300;
    line-height: 2.35; letter-spacing: 2.5px;
    opacity: 0; transform: translateY(14px);
    animation: rise 1.1s ease forwards;
  }
  .poem .gap { height: 1.4em; }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-out { animation: sink 0.5s ease forwards; }
  @keyframes sink {
    to { opacity: 0; transform: translateY(-10px); }
  }
  /* 长诗：更紧凑的排版 */
  .poem.long h2 { margin-bottom: 0.8vh; }
  .poem.long .date { margin-bottom: 3vh; }
  .poem.long .line {
    font-size: clamp(15px, 1.75vw, 18px);
    line-height: 2.05; letter-spacing: 2px;
  }
  .poem.long .gap { height: 1em; }
  /* 下滑提示 */
  .scroll-hint {
    position: fixed; bottom: 74px; left: 50%; z-index: 10;
    color: rgba(255,255,255,0.55); font-size: 12px; letter-spacing: 3px;
    opacity: 0; pointer-events: none; transition: opacity 0.8s;
    transform: translateX(-50%);
  }
  .scroll-hint.show { opacity: 1; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 7px); }
  }
  .arrow {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 10;
    background: none; border: none; color: rgba(255,255,255,0.35);
    font-size: 34px; cursor: pointer; padding: 20px 16px;
    font-family: inherit; transition: color 0.3s, transform 0.3s;
    user-select: none;
  }
  .arrow:hover { color: rgba(255,255,255,0.85); }
  .arrow.prev { left: 14px; }
  .arrow.next { right: 14px; }
  .dots {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 13px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.25); cursor: pointer;
    transition: background 0.4s, transform 0.4s;
  }
  .dot.active { background: rgba(255,255,255,0.9); transform: scale(1.35); }
  .hint {
    position: fixed; bottom: 32px; right: 36px; z-index: 10;
    font-size: 12px; letter-spacing: 2px; opacity: 0.3; font-weight: 300;
  }
  /* 封面 */
  #cover {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 1.2s ease;
  }
  #cover.hidden { opacity: 0; pointer-events: none; }
  #cover .c-title {
    font-size: clamp(40px, 7vw, 78px); font-weight: 500;
    letter-spacing: 26px; text-indent: 26px;
    text-shadow: 0 0 46px rgba(180,160,255,0.4);
    opacity: 0; animation: rise 1.8s ease 0.3s forwards;
  }
  #cover .c-epigraph {
    margin-top: 4vh; font-size: clamp(13px, 1.4vw, 16px); font-weight: 300;
    letter-spacing: 4px; color: rgba(255,255,255,0.5);
    opacity: 0; animation: rise 1.8s ease 1s forwards;
  }
  #cover .c-sub {
    margin-top: 1.6vh; font-size: clamp(15px, 1.7vw, 19px); font-weight: 300;
    letter-spacing: 12px; text-indent: 12px; color: rgba(255,255,255,0.75);
    opacity: 0; animation: rise 1.8s ease 1.4s forwards;
  }
  #cover .c-enter {
    margin-top: 6vh; padding: 13px 48px;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 999px;
    background: transparent; color: rgba(255,255,255,0.85);
    font-family: inherit; font-size: 15px; letter-spacing: 9px; text-indent: 9px;
    cursor: pointer; opacity: 0; animation: rise 1.8s ease 1.9s forwards;
    transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
  }
  #cover .c-enter:hover {
    background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.75);
    box-shadow: 0 0 24px rgba(180,160,255,0.25);
  }
  body.on-cover header, body.on-cover .counter, body.on-cover .arrow,
  body.on-cover .dots, body.on-cover .hint, body.on-cover .scroll-hint {
    opacity: 0 !important; pointer-events: none;
  }
  @media (max-width: 600px) {
    header { left: 20px; } .counter { right: 20px; }
    .hint { display: none; }
    .arrow.prev { left: 2px; } .arrow.next { right: 2px; }
    .dots { gap: 10px; }
  }
</style>
</head>
<body>

<div class="bg-layer" id="bgA"></div>
<div class="bg-layer" id="bgB"></div>
<canvas id="particles"></canvas>
<div class="vignette"></div>

<header id="siteTitle" title="回到封面">梦 蝶</header>
<div class="counter" id="counter"></div>

<main><div class="poem" id="poem"></div></main>

<button class="arrow prev" id="prevBtn" aria-label="上一首">‹</button>
<button class="arrow next" id="nextBtn" aria-label="下一首">›</button>
<div class="dots" id="dots"></div>
<div class="hint">← → 翻页</div>
<div class="scroll-hint" id="scrollHint">下 滑 · 读 全 诗 ↓</div>

<div id="cover">
  <div class="c-title">朝花夕拾</div>
  <div class="c-epigraph">不知周之梦为胡蝶与 · 胡蝶之梦为周与</div>
  <div class="c-sub">梦蝶 · 诗集</div>
  <button class="c-enter" id="enterBtn">进 入</button>
</div>

<script>
/*POEMS_START*/
const poems = [
  {
    title: "女王",
    date: "2026.07.18",
    theme: "queen",
    lines: ["我，还有委屈，","还有普通人的七情六欲，","大约再修两百年也无法修成","你们期待的样子。","于是最终决定","不再执着于成为","你们心目中完美的","幻影","","当我","开始接纳真实的，甚至有点丑陋的自己","不再因执着于梦幻泡影","而被拿捏、被折磨","变得身不由己、面目全非","","当我开始珍爱自己","哪怕从里到外都已满目疮痍","那些无法轻易遮盖的惨烈伤痕","是生命授予的勋章","伤痕累累却美得耀眼","不再需要世界的评价与认可","因为我","是自己的女王","将用灵魂为自己的身体","加冕"]
  },
  {
    title: "灯",
    date: "2026.07.18",
    theme: "lamps",
    lines: ["一盏一盏被熄灭","快到终审的日子了","心","逐渐变得平静","除了顺从与接纳","别无选择","没有波澜","不再期待那个最后的答案","等待他们","撕下虚伪的画皮","在月光下显露原形","谁的心里没有住过魔鬼呢","也许","一切皆可原谅"]
  },
  {
    title: "涅槃",
    date: "2026.07.19",
    theme: "phoenix",
    lines: ["谁也看不出","昨晚 在这个房间","发生过一场谋杀","一切都完好如初","不露痕迹","昨夜的我已经在愤怒中死去","用诗歌把流血的伤口缝合","用别人的伤痕疗愈自己的伤痕","完成了又一场涅槃"]
  },
  {
    title: "今夜",
    date: "2026.07.09",
    theme: "night",
    lines: ["想要打破世界的束缚","任性地沉醉","栀子花的香气粘不住","这破碎的灵魂","黑夜","像一只巨大的酒杯","却接不住","弥漫成河的悲伤","注定走不出这牢门","因为心","早已被流放"]
  },
  {
    title: "月色",
    date: "2026.07.09",
    theme: "moon",
    lines: ["是谁，在深夜徘徊彷徨","月光清冽","心事一览无余","如果月圆之夜","真的能打开","通往另一个世界的大门","期待你来把我带走","","清晨","在梦中与你谈笑如常","执手缠绵","仿佛未来有一生那么长","直到猝不及防地醒来","再也找不到","魂牵梦萦的桃花源","","如果梦","是另一个平行宇宙","祈祷上天指引我找到入口","继续演绎一场有预谋的","风花雪月","虽然结局早已写好","可世间男女","有谁能抗拒这份危险的美丽"]
  },
  {
    title: "星辰",
    date: "2021.02",
    theme: "stars",
    lines: ["没有你的日子","阳光再暖 也","晒不化","心底的寒冰","昨夜","梦中的你","眼中星光闪烁","笑容 一如既往","温暖又美丽","仿佛触手可及","却","转瞬即逝","","不愿醒来","期待","在下一个梦境与你","相遇","这样 是不是","你就会","永远","陪在我","身边","","如果把梦拉得更长一些","是不是 就可以","把这刹那的","温柔","定格得","更久一些","","深夜的星空","寂静浩渺","一切缄默不语","漫天星辰","努力撕开黑夜的","凝重","月白色的光芒","温暖而美丽","似曾相识","宛若你","深情凝视的","目光"]
  },
  {
    title: "这忧伤，与生俱来",
    date: "2026.07.07",
    theme: "inkmist",
    lines: ["熟悉又陌生，美丽又痛苦","有时是浅蓝色，有时是浅紫色","有时又是浓浓的绿抑或深深的紫","有时是一丝一丝的","有时又是大朵大朵的","有时浓得像被水墨氤氲的画","有时轻得像天边游走的浮云","喜欢这沉醉的感觉","让一切蒙上诗意的颜色","苦涩中映照出美丽","无法言传的美","是灵魂吟唱的歌声","等待一个被破译的频率"]
  },
  {
    title: "心事",
    date: "2026.07.07",
    theme: "meadow",
    lines: ["无人在意","那绿野丛中的一抹深蓝","他已沉默地等待多年","期待一朵白云再次留下","惊鸿一瞥","","多年后","依然无法忘记那一刻","灵魂的悸动","他终于读懂了","她的美丽心事","沉寂许久的心","泛起涟漪","第一次感觉自惭形秽","尚未来得及积攒足够的勇气","她已被晚风催促着","黯然离去","","从此","思念像被时光凝成的琥珀","日日映照","他的惆怅与期待","不知道下一场相遇","会在何时","于是日日祈求路过的晚风","带去他的思念","告知她","他的心里装着一整片天空","从此，她再也不必","在风中流浪"]
  }
];
/*POEMS_END*/

const gradients = {
  cover:   "radial-gradient(ellipse at 50% 18%, rgba(150,130,220,0.2) 0%, transparent 50%), linear-gradient(170deg, #0a0918 0%, #17123a 50%, #261a4e 82%, #1a1030 100%)",
  night:   "linear-gradient(170deg, #06060f 0%, #12102b 40%, #241035 70%, #3a0d22 100%)",
  queen:   "radial-gradient(ellipse at 50% -10%, rgba(212,164,74,0.22) 0%, transparent 45%), linear-gradient(165deg, #120a10 0%, #241016 45%, #2e130f 80%, #1a0b08 100%)",
  lamps:   "radial-gradient(ellipse at 82% 12%, rgba(190,205,235,0.14) 0%, transparent 38%), linear-gradient(175deg, #04070e 0%, #0b1220 55%, #101625 100%)",
  phoenix: "linear-gradient(170deg, #0a0a0d 0%, #170e0b 45%, #241108 78%, #301507 100%)",
  moon:    "radial-gradient(circle at 74% 20%, rgba(222,228,248,0.2) 0%, transparent 32%), linear-gradient(170deg, #090c1a 0%, #121a34 50%, #1b2342 100%)",
  stars:   "linear-gradient(180deg, #04060f 0%, #0a0e24 55%, #111536 100%)",
  inkmist: "linear-gradient(170deg, #0b0d15 0%, #131629 45%, #101b26 78%, #151228 100%)",
  meadow:  "radial-gradient(ellipse at 28% 88%, rgba(58,128,88,0.28) 0%, transparent 55%), linear-gradient(175deg, #060c0a 0%, #0c1a12 55%, #12241a 100%)"
};

// ---------- background crossfade ----------
const bgA = document.getElementById("bgA"), bgB = document.getElementById("bgB");
let activeBg = bgA;
function setBackground(theme) {
  const incoming = activeBg === bgA ? bgB : bgA;
  incoming.style.background = gradients[theme];
  incoming.classList.add("visible");
  activeBg.classList.remove("visible");
  activeBg = incoming;
}

// ---------- particle system ----------
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let W, H, particles = [], extras = {}, currentTheme = null, canvasAlpha = 0, targetAlpha = 1;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}
window.addEventListener("resize", () => { resize(); initParticles(currentTheme); });
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const butterflyColors = ["#b9a7e8", "#e8d4a0", "#d8a8c8", "#cfd6f2", "#a89ae0"];

function initParticles(theme) {
  particles = [];
  extras = {};
  const s = devicePixelRatio;
  if (theme === "cover") {
    for (let i = 0; i < 9; i++) particles.push({
      kind: "b",
      x: rand(0, W), y: rand(0.1, 0.9) * H,
      ang: rand(0, Math.PI * 2), speed: rand(0.3, 0.9) * s,
      flap: rand(0, Math.PI * 2), flapSpeed: rand(0.12, 0.22),
      size: rand(7, 18) * s, seed: rand(0, 10),
      color: butterflyColors[i % butterflyColors.length],
      o: rand(0.5, 0.95)
    });
    for (let i = 0; i < 45; i++) particles.push({
      kind: "d",
      x: rand(0, W), y: rand(0, H), r: rand(0.6, 1.8) * s,
      vy: -rand(0.02, 0.12) * s, tw: rand(0, Math.PI * 2),
      twSpeed: rand(0.008, 0.03), o: rand(0.2, 0.7)
    });
  } else if (theme === "night") {
    for (let i = 0; i < 26; i++) particles.push({
      x: rand(0, W), y: rand(0, H), r: rand(2.2, 4.5) * s,
      vy: rand(0.15, 0.45) * s, phase: rand(0, Math.PI * 2),
      sway: rand(0.3, 0.9) * s, o: rand(0.25, 0.65), rot: rand(0, Math.PI)
    });
  } else if (theme === "queen") {
    for (let i = 0; i < 70; i++) particles.push({
      x: rand(0, W), y: rand(0, H), r: rand(0.7, 2.2) * s,
      vy: -rand(0.05, 0.25) * s, tw: rand(0, Math.PI * 2),
      twSpeed: rand(0.01, 0.04), o: rand(0.3, 0.9)
    });
  } else if (theme === "lamps") {
    for (let i = 0; i < 11; i++) particles.push({
      x: rand(0.06, 0.94) * W, y: rand(0.12, 0.68) * H,
      r: rand(2.5, 5) * s, glow: rand(26, 55) * s,
      b: rand(0.5, 1), state: "on",
      timer: rand(200, 900), flick: rand(0, Math.PI * 2)
    });
  } else if (theme === "phoenix") {
    for (let i = 0; i < 55; i++) particles.push(newEmber(true));
  } else if (theme === "moon") {
    // 流云
    for (let i = 0; i < 6; i++) particles.push({
      kind: "c",
      x: rand(0, W), y: rand(0.08, 0.55) * H,
      w: rand(0.2, 0.42) * W, h: rand(30, 70) * s,
      vx: rand(0.06, 0.22) * s, o: rand(0.04, 0.1)
    });
    // 月尘微光
    for (let i = 0; i < 30; i++) particles.push({
      kind: "d",
      x: rand(0, W), y: rand(0, H), r: rand(0.6, 1.6) * s,
      vy: -rand(0.02, 0.1) * s, tw: rand(0, Math.PI * 2),
      twSpeed: rand(0.008, 0.025), o: rand(0.2, 0.6)
    });
  } else if (theme === "stars") {
    for (let i = 0; i < 130; i++) particles.push({
      x: rand(0, W), y: rand(0, H * 0.92),
      r: rand(0.5, 1.9) * s, tw: rand(0, Math.PI * 2),
      twSpeed: rand(0.01, 0.05), o: rand(0.3, 1)
    });
    extras.meteor = { active: false, timer: rand(200, 500) };
  } else if (theme === "inkmist") {
    const inks = ["110,150,220", "150,120,215", "90,170,140", "120,90,185"];
    for (let i = 0; i < 7; i++) particles.push({
      x: rand(0, W), y: rand(0.15, 0.85) * H,
      r: rand(0.13, 0.3) * Math.min(W, H) * 1.6,
      vx: rand(-0.08, 0.08) * s, vy: rand(-0.05, 0.05) * s,
      pulse: rand(0, Math.PI * 2), pulseSpeed: rand(0.002, 0.006),
      color: inks[i % inks.length], o: rand(0.05, 0.12)
    });
  } else if (theme === "meadow") {
    // 风中飞絮
    for (let i = 0; i < 32; i++) particles.push({
      kind: "seed",
      x: rand(0, W), y: rand(0, H), r: rand(0.8, 2) * s,
      vx: rand(0.1, 0.4) * s, vy: -rand(0.05, 0.25) * s,
      phase: rand(0, Math.PI * 2), o: rand(0.25, 0.7)
    });
    // 一朵白云
    particles.push({
      kind: "c",
      x: rand(0.1, 0.5) * W, y: rand(0.1, 0.22) * H,
      w: 0.3 * W, h: 45 * s, vx: 0.1 * s, o: 0.09
    });
    extras.flower = { x: 0.28 * W, y: 0.86 * H, pulse: 0 };
  }
}
function newEmber(scatter) {
  const s = devicePixelRatio;
  return {
    x: rand(0, W), y: scatter ? rand(0, H) : H + 10,
    r: rand(0.8, 2.6) * s, vy: -rand(0.25, 0.9) * s,
    vx: rand(-0.15, 0.15) * s, tw: rand(0, Math.PI * 2),
    o: rand(0.4, 0.95)
  };
}

function drawCloud(p) {
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.w / 2);
  g.addColorStop(0, `rgba(210,218,240,${p.o})`);
  g.addColorStop(1, "rgba(210,218,240,0)");
  ctx.globalAlpha = canvasAlpha;
  ctx.fillStyle = g;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(1, p.h / (p.w / 2));
  ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  canvasAlpha += (targetAlpha - canvasAlpha) * 0.06;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = Math.max(0, canvasAlpha);
  const t = performance.now() / 1000;
  const s = devicePixelRatio;

  if (currentTheme === "cover") {
    for (const p of particles) {
      if (p.kind === "d") {
        p.y += p.vy; p.tw += p.twSpeed;
        if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
        const a = p.o * (0.3 + 0.7 * Math.abs(Math.sin(p.tw)));
        ctx.globalAlpha = canvasAlpha * a;
        ctx.fillStyle = "#cfc8f0";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      p.flap += p.flapSpeed;
      p.ang += Math.sin(t * 0.6 + p.seed) * 0.018;
      p.x += Math.cos(p.ang) * p.speed;
      p.y += Math.sin(p.ang) * p.speed * 0.7 + Math.sin(p.flap * 0.5) * 0.2 * s;
      const m = 40 * s;
      if (p.x < -m) p.x = W + m; if (p.x > W + m) p.x = -m;
      if (p.y < -m) p.y = H + m; if (p.y > H + m) p.y = -m;
      const flapW = 0.3 + 0.7 * Math.abs(Math.sin(p.flap));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.ang + Math.PI / 2);
      ctx.globalAlpha = canvasAlpha * p.o;
      ctx.shadowColor = p.color; ctx.shadowBlur = 10 * s;
      ctx.fillStyle = p.color;
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.scale(side * flapW, 1);
        ctx.beginPath();
        ctx.ellipse(p.size * 0.55, -p.size * 0.22, p.size * 0.55, p.size * 0.38, -0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(p.size * 0.38, p.size * 0.32, p.size * 0.36, p.size * 0.27, 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(250,248,255,0.85)";
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 0.08, p.size * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  } else if (currentTheme === "night") {
    for (const p of particles) {
      p.y += p.vy; p.phase += 0.012;
      p.x += Math.sin(p.phase) * p.sway * 0.3;
      if (p.y > H + 10) { p.y = -10; p.x = rand(0, W); }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + Math.sin(p.phase) * 0.5);
      ctx.globalAlpha = canvasAlpha * p.o;
      ctx.fillStyle = "#f5efdf";
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  } else if (currentTheme === "queen") {
    for (const p of particles) {
      p.y += p.vy; p.tw += p.twSpeed;
      if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
      const a = p.o * (0.35 + 0.65 * Math.abs(Math.sin(p.tw)));
      ctx.globalAlpha = canvasAlpha * a;
      ctx.fillStyle = "#e8c56d";
      ctx.shadowColor = "#d4a44a"; ctx.shadowBlur = 6 * s;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  } else if (currentTheme === "lamps") {
    for (const p of particles) {
      p.flick += 0.05; p.timer--;
      if (p.timer <= 0) {
        if (p.state === "on") { p.state = "dying"; }
        else if (p.state === "off") { p.state = "waking"; }
      }
      if (p.state === "dying") { p.b -= 0.008; if (p.b <= 0.02) { p.b = 0.02; p.state = "off"; p.timer = rand(300, 800); } }
      if (p.state === "waking") { p.b += 0.004; if (p.b >= rand(0.6, 1)) { p.state = "on"; p.timer = rand(500, 1400); } }
      const b = p.b * (0.85 + 0.15 * Math.sin(p.flick * 2.3));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.glow);
      g.addColorStop(0, `rgba(255,186,110,${0.5 * b})`);
      g.addColorStop(1, "rgba(255,186,110,0)");
      ctx.globalAlpha = canvasAlpha;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.glow, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,214,160,${b})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.7 + 0.3 * b), 0, Math.PI * 2); ctx.fill();
    }
  } else if (currentTheme === "phoenix") {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.y += p.vy; p.x += p.vx + Math.sin(t * 2 + p.tw) * 0.15 * s;
      p.tw += 0.06;
      if (p.y < -10) particles[i] = newEmber(false);
      const heightFade = Math.min(1, p.y / (H * 0.35));
      const a = p.o * heightFade * (0.6 + 0.4 * Math.sin(p.tw));
      ctx.globalAlpha = canvasAlpha * Math.max(0, a);
      ctx.fillStyle = Math.sin(p.tw) > 0.3 ? "#ffb35c" : "#e8622e";
      ctx.shadowColor = "#ff7b33"; ctx.shadowBlur = 5 * s;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  } else if (currentTheme === "moon") {
    // 明月
    const mx = W * 0.74, my = H * 0.2, mr = Math.min(W, H) * 0.055;
    const halo = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
    halo.addColorStop(0, "rgba(226,232,252,0.25)");
    halo.addColorStop(1, "rgba(226,232,252,0)");
    ctx.globalAlpha = canvasAlpha;
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e9ecf8";
    ctx.shadowColor = "#dfe5fa"; ctx.shadowBlur = 30 * s;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    for (const p of particles) {
      if (p.kind === "c") {
        p.x += p.vx;
        if (p.x - p.w / 2 > W) p.x = -p.w / 2;
        drawCloud(p);
      } else {
        p.y += p.vy; p.tw += p.twSpeed;
        if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
        const a = p.o * (0.3 + 0.7 * Math.abs(Math.sin(p.tw)));
        ctx.globalAlpha = canvasAlpha * a;
        ctx.fillStyle = "#dfe4f5";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }
  } else if (currentTheme === "stars") {
    for (const p of particles) {
      p.tw += p.twSpeed;
      const a = p.o * (0.25 + 0.75 * Math.abs(Math.sin(p.tw)));
      ctx.globalAlpha = canvasAlpha * a;
      ctx.fillStyle = "#e8ecfa";
      ctx.shadowColor = "#c8d2f5"; ctx.shadowBlur = p.r * 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    // 偶尔一颗流星
    const m = extras.meteor;
    if (m) {
      if (!m.active) {
        m.timer--;
        if (m.timer <= 0) {
          m.active = true;
          m.x = rand(0.2, 0.9) * W; m.y = rand(0, 0.25) * H;
          m.vx = -rand(6, 9) * s; m.vy = rand(3, 5) * s;
          m.life = 1;
        }
      } else {
        m.x += m.vx; m.y += m.vy; m.life -= 0.02;
        if (m.life <= 0) { m.active = false; m.timer = rand(400, 900); }
        else {
          const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 10, m.y - m.vy * 10);
          grad.addColorStop(0, `rgba(240,244,255,${0.8 * m.life})`);
          grad.addColorStop(1, "rgba(240,244,255,0)");
          ctx.globalAlpha = canvasAlpha;
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6 * s;
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(m.x - m.vx * 10, m.y - m.vy * 10);
          ctx.stroke();
        }
      }
    }
  } else if (currentTheme === "inkmist") {
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.pulse += p.pulseSpeed;
      if (p.x < -p.r) p.x = W + p.r; if (p.x > W + p.r) p.x = -p.r;
      if (p.y < -p.r) p.y = H + p.r; if (p.y > H + p.r) p.y = -p.r;
      const r = p.r * (0.85 + 0.15 * Math.sin(p.pulse));
      const a = p.o * (0.7 + 0.3 * Math.sin(p.pulse * 1.3));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, `rgba(${p.color},${a})`);
      g.addColorStop(1, `rgba(${p.color},0)`);
      ctx.globalAlpha = canvasAlpha;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    }
  } else if (currentTheme === "meadow") {
    // 深蓝的那朵花
    const f = extras.flower;
    if (f) {
      f.pulse += 0.02;
      const fr = (26 + 8 * Math.sin(f.pulse)) * s;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, fr * 3);
      g.addColorStop(0, "rgba(70,110,235,0.4)");
      g.addColorStop(0.4, "rgba(60,95,210,0.15)");
      g.addColorStop(1, "rgba(60,95,210,0)");
      ctx.globalAlpha = canvasAlpha;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, fr * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(120,155,255,0.9)";
      ctx.shadowColor = "#5b7dff"; ctx.shadowBlur = 14 * s;
      ctx.beginPath(); ctx.arc(f.x, f.y, 3.2 * s, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    for (const p of particles) {
      if (p.kind === "c") {
        p.x += p.vx;
        if (p.x - p.w / 2 > W) p.x = -p.w / 2;
        drawCloud(p);
        continue;
      }
      p.phase += 0.02;
      p.x += p.vx + Math.sin(p.phase) * 0.3 * s;
      p.y += p.vy;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
      ctx.globalAlpha = canvasAlpha * p.o * (0.5 + 0.5 * Math.abs(Math.sin(p.phase * 0.7)));
      ctx.fillStyle = "#eef2e8";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  requestAnimationFrame(draw);
}

// ---------- poem rendering ----------
const poemEl = document.getElementById("poem");
const counterEl = document.getElementById("counter");
const dotsEl = document.getElementById("dots");
const scrollHint = document.getElementById("scrollHint");
let index = 0, switching = false;

let dots = [];
function buildDots() {
  dotsEl.innerHTML = "";
  poems.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "dot";
    d.title = p.title;
    d.addEventListener("click", () => goTo(i));
    dotsEl.appendChild(d);
  });
  dots = [...dotsEl.children];
}
buildDots();

function renderPoem(i) {
  const p = poems[i];
  poemEl.innerHTML = "";
  poemEl.scrollTop = 0;
  poemEl.classList.toggle("long", p.lines.length > 16);
  const h = document.createElement("h2");
  h.textContent = p.title;
  poemEl.appendChild(h);
  if (p.date) {
    const d = document.createElement("div");
    d.className = "date";
    d.textContent = p.date;
    poemEl.appendChild(d);
  }
  p.lines.forEach((line, n) => {
    const el = document.createElement("div");
    if (line === "") { el.className = "gap"; }
    else {
      el.className = "line";
      el.textContent = line;
      el.style.animationDelay = (0.5 + n * 0.12) + "s";
    }
    poemEl.appendChild(el);
  });
  counterEl.textContent = String(i + 1).padStart(2, "0") + " / " + String(poems.length).padStart(2, "0");
  dots.forEach((d, n) => d.classList.toggle("active", n === i));
  scrollHint.classList.remove("show");
  setTimeout(() => {
    if (poemEl.scrollHeight > poemEl.clientHeight + 24) scrollHint.classList.add("show");
  }, 800);
}

poemEl.addEventListener("scroll", () => {
  if (poemEl.scrollTop > 40) scrollHint.classList.remove("show");
});
document.addEventListener("wheel", e => {
  if (document.body.classList.contains("on-cover")) return;
  poemEl.scrollTop += e.deltaY;
}, { passive: true });

function goTo(i, force) {
  if (switching || (!force && i === index)) return;
  if (i < 0) i = poems.length - 1;
  if (i >= poems.length) i = 0;
  switching = true;
  index = i;
  const theme = poems[i].theme;
  poemEl.classList.add("fade-out");
  targetAlpha = 0;
  setBackground(theme);
  setTimeout(() => {
    currentTheme = theme;
    initParticles(theme);
    targetAlpha = 1;
    poemEl.classList.remove("fade-out");
    renderPoem(i);
    switching = false;
  }, 520);
}

// ---------- 封面 ----------
const cover = document.getElementById("cover");
function enterSite() {
  if (!document.body.classList.contains("on-cover")) return;
  document.body.classList.remove("on-cover");
  cover.classList.add("hidden");
  goTo(index, true);
}
function showCover() {
  if (document.body.classList.contains("on-cover") || switching) return;
  document.body.classList.add("on-cover");
  cover.classList.remove("hidden");
  switching = true;
  targetAlpha = 0;
  setBackground("cover");
  poemEl.classList.add("fade-out");
  setTimeout(() => {
    poemEl.classList.remove("fade-out");
    poemEl.innerHTML = "";
    currentTheme = "cover";
    initParticles("cover");
    targetAlpha = 1;
    switching = false;
  }, 520);
}
cover.addEventListener("click", enterSite);
document.getElementById("siteTitle").addEventListener("click", showCover);

document.getElementById("prevBtn").addEventListener("click", () => goTo(index - 1));
document.getElementById("nextBtn").addEventListener("click", () => goTo(index + 1));
document.addEventListener("keydown", e => {
  if (document.body.classList.contains("on-cover")) {
    if (e.key === "Enter" || e.key === " ") enterSite();
    return;
  }
  if (e.key === "ArrowLeft") goTo(index - 1);
  if (e.key === "ArrowRight") goTo(index + 1);
  if (e.key === "Escape") showCover();
});
let touchX = null;
document.addEventListener("touchstart", e => touchX = e.touches[0].clientX, { passive: true });
document.addEventListener("touchend", e => {
  if (touchX === null || document.body.classList.contains("on-cover")) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) goTo(index + (dx < 0 ? 1 : -1));
  touchX = null;
}, { passive: true });

// ---------- 云端同步（部署后自动读取最新已发表的诗；未配置则用本文件内置数据） ----------
/*CLOUD_START*/
const CLOUD = {
  url: "https://cuvglzufscjqrxchhdyp.supabase.co",
  key: "sb_publishable_Ito6WzgaoSsAetAvzzkrIw_s1Tu10bJ"
};
/*CLOUD_END*/
async function loadCloudPoems() {
  if (!CLOUD.url || !CLOUD.key) return;
  try {
    const r = await fetch(CLOUD.url + "/rest/v1/mengdie_store?id=eq.main&select=data,updated_at", {
      headers: { "apikey": CLOUD.key, "Authorization": "Bearer " + CLOUD.key }
    });
    if (!r.ok) return;
    const rows = await r.json();
    const d = rows[0] && rows[0].data;
    if (!d || !Array.isArray(d.poems)) return;
    const pub = d.poems.filter(p => p.status === "pub" && Array.isArray(p.lines) && p.lines.length).map(p => ({
      title: p.title || "无题",
      date: p.date || "",
      theme: gradients[p.theme] ? p.theme : "night",
      lines: p.lines
    }));
    if (!pub.length) return;
    poems.length = 0;
    for (const p of pub) poems.push(p);
    index = Math.min(index, poems.length - 1);
    buildDots();
    if (!document.body.classList.contains("on-cover")) renderPoem(index);
  } catch (e) { /* 网络失败时静默使用内置数据 */ }
}

// ---------- init ----------
document.body.classList.add("on-cover");
currentTheme = "cover";
setBackground("cover");
initParticles("cover");
draw();
loadCloudPoems();
